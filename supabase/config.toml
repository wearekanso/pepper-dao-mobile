# Supabase Configuration
# Project: Pepper DAO Mobile
# Remote project ref: ggehypjsdpouiklchate (link with `supabase link --project-ref ggehypjsdpouiklchate`)

# Local identifier only; the remote project is chosen by `supabase link`
project_id = "pepper-dao"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "exp://localhost:8081"
# The app signs every user in anonymously (contexts/user-context.tsx). Keep
# this on, or `supabase config push` turns it off on the remote project.
enable_anonymous_sign_ins = true

[functions]
# Edge Functions configuration
# Deploy: supabase functions deploy <function-name>
# Logs: supabase functions logs <function-name>

# The pg_cron job calls sync-proposals without a JWT. Without this, a plain
# `supabase functions deploy` turns JWT checks on and every cron run gets 401.
[functions.sync-proposals]
verify_jwt = false

